name: Build and deploy Node.js app to Azure Web App - admin-central-api

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Generate Prisma Client
        run: npx prisma generate
        # หมายเหตุ: ขั้นตอนนี้ใช้ DATABASE_URL จาก Secrets ถ้ายังไม่ได้ตั้งใน GitHub ให้ไปตั้งก่อนครับ
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: .

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_DB942D4EFB3C4C6EBD8EDB398EA99280 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_952E3F83DA1D4D958D83E36C3C291CF4 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_B231390F3F2D427D8D5F9CD704A9D481 }}

      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'admin-central-api'
          slot-name: 'Production'
          package: .